name: Windows CFW build
on:
  push:
    tags:
      - 'v*-cfw.*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and prepare bundled resources
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm run review
      - name: Run tests
        run: pnpm test
      - name: Build Windows x64
        run: pnpm build:win --x64
      - name: Prepare portable package and checksums
        run: node scripts/cfw-release.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: clash-party-cfw-windows-x64
          path: |
            dist/*setup.exe
            dist/*portable.7z
            dist/*.sha256
            dist/latest.yml
          if-no-files-found: error
      - name: Publish custom Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Clash Party CFW icons ${{ github.ref_name }}
          body: '经典渐变小猫：关闭深蓝、规则与直连绿色、全局与 TUN 橙色；透明背景。下载 setup.exe 安装包或 portable.7z 便携包。'
          prerelease: false
          files: |
            dist/*setup.exe
            dist/*portable.7z
            dist/*.sha256
            dist/latest.yml
